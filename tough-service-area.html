<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Area Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    --sa-gray:   #6d6e71;
    --sa-red:    #e8392f;
    --sa-yellow: #f6d23d;
    --sa-green:  #2f9e6e;
    --sa-blue:   #0072bc;
    --sa-ink:    #1a1a1a;
    --sa-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  html,body{margin:0;padding:0;}
  .sa-wrap{
    max-width: 900px;
    margin: 0 auto;
    font-family: var(--sa-font);
  }
  #service-area-map{
    height: 560px;
    width: 100%;
    border-radius: 10px;
    z-index: 0; /* keep below site nav dropdowns */
  }
  @media (max-width: 640px){
    #service-area-map{ height: 420px; }
  }

  /* ---- Legend (skewed swatches echo the print version) ---- */
  .sa-legend{
    background:#fff;
    border-radius:10px;
    box-shadow:0 1px 8px rgba(0,0,0,.18);
    padding:14px 16px;
    font-size:13px;
    line-height:1.3;
    color:var(--sa-ink);
    max-width:250px;
  }
  .sa-legend h4{
    margin:0 0 10px;
    font-size:11px;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:#6d6e71;
  }
  .sa-legend .row{
    display:flex;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
    font-weight:600;
  }
  .sa-legend .row:last-child{margin-bottom:0;}
  .sa-legend .swatch{
    flex:0 0 26px;
    height:15px;
    margin-top:1px;
    transform:skewX(-18deg);
    border-radius:2px;
  }
  /* hide legend on tiny screens? keep it, just shrink */
  @media (max-width: 480px){
    .sa-legend{max-width:190px;font-size:12px;padding:10px 12px;}
  }

  /* ---- Popups ---- */
  .leaflet-popup-content{margin:14px 18px;font-family:var(--sa-font);}
  .sa-pop h3{margin:0 0 2px;font-size:15px;color:var(--sa-ink);}
  .sa-pop .tier{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    color:#fff;
    padding:3px 9px;
    border-radius:3px;
    margin:4px 0 8px;
  }
  .sa-pop ul{margin:0;padding-left:18px;font-size:13px;color:#333;}
  .sa-pop li{margin-bottom:2px;}

  /* ---- City labels ---- */
  .sa-city-label{
    background:transparent;
    border:none;
    box-shadow:none;
    font-family:var(--sa-font);
    font-weight:700;
    font-size:13px;
    color:#111;
    text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff;
    white-space:nowrap;
  }
  .sa-city-label::before{content:none;}

  /* ---- State labels ---- */
  .sa-state-label{
    background:transparent;
    border:none;
    box-shadow:none;
    font-family:var(--sa-font);
    font-weight:600;
    font-size:11px;
    letter-spacing:.18em;
    color:#85878c;
    text-shadow:0 0 3px #fff,0 0 3px #fff;
    white-space:nowrap;
    pointer-events:none;
  }
  .sa-state-label::before{content:none;}
</style>
</head>
<body>
<div class="sa-wrap">
  <div id="service-area-map"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

/* =====================================================================
   3. Map logic
   ===================================================================== */
(function () {
  // Build a quick lookup: "name, ST" -> tier key
  const tierByCounty = {};
  for (const [tierKey, list] of Object.entries(ASSIGNMENTS)) {
    list.forEach(c => { tierByCounty[c.trim().toLowerCase()] = tierKey; });
  }

  const map = L.map("service-area-map", {
    scrollWheelZoom: MAP_OPTIONS.scrollWheelZoom,
    attributionControl: true
  });

  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions">CARTO</a>',
    subdomains: "abcd",
    maxZoom: 19
  }).addTo(map);

  // State outlines (drawn first, so colored zones sit on top)
  if (MAP_OPTIONS.stateOutlines && MAP_OPTIONS.stateOutlines.show) {
    const so = MAP_OPTIONS.stateOutlines;
    L.geoJSON(STATES, {
      interactive: false,
      style: {
        fill: false,
        color: so.color,
        weight: so.weight,
        dashArray: so.dashArray || null
      }
    }).addTo(map);

    if (so.labels) {
      const labelPos = {
        "New Hampshire": [43.55, -71.65],
        "Vermont":       [43.95, -72.75],
        "Maine":         [44.55, -69.9],
        "Massachusetts": [42.35, -72.2],
        "Connecticut":   [41.6,  -72.7],
        "Rhode Island":  [41.55, -71.45],
        "New York":      [42.7,  -74.3]
      };
      STATES.features.forEach(f => {
        const pos = labelPos[f.properties.name];
        if (!pos) return;
        L.tooltip({
          permanent: true,
          direction: "center",
          className: "sa-state-label"
        }).setContent(f.properties.name.toUpperCase()).setLatLng(pos).addTo(map);
      });
    }
  }

  function styleFor(feature) {
    const key = (feature.properties.name + ", " + feature.properties.state).toLowerCase();
    const tierKey = tierByCounty[key];
    if (!tierKey) return { fillOpacity: 0, opacity: 0, interactive: false };
    return {
      fillColor: TIERS[tierKey].color,
      fillOpacity: MAP_OPTIONS.fillOpacity,
      color: "#ffffff",
      weight: 1.5
    };
  }

  function popupFor(feature) {
    const key = (feature.properties.name + ", " + feature.properties.state).toLowerCase();
    const tierKey = tierByCounty[key];
    if (!tierKey) return null;
    const tier = TIERS[tierKey];
    return (
      '<div class="sa-pop">' +
        "<h3>" + feature.properties.name + " County, " + feature.properties.state + "</h3>" +
        '<span class="tier" style="background:' + tier.color + '">' + tier.label + "</span>" +
        "<ul>" + tier.services.map(s => "<li>" + s + "</li>").join("") + "</ul>" +
      "</div>"
    );
  }

  const geoLayer = L.geoJSON(COUNTIES, {
    style: styleFor,
    filter: f => {
      const key = (f.properties.name + ", " + f.properties.state).toLowerCase();
      return !!tierByCounty[key];
    },
    onEachFeature: (feature, layer) => {
      const html = popupFor(feature);
      if (html) layer.bindPopup(html);
      layer.on({
        mouseover: e => {
          e.target.setStyle({ fillOpacity: Math.min(MAP_OPTIONS.fillOpacity + 0.25, 0.9), weight: 2.5 });
          e.target.bringToFront();
        },
        mouseout: e => geoLayer.resetStyle(e.target)
      });
    }
  }).addTo(map);

  map.fitBounds(geoLayer.getBounds().pad(0.06));

  // City labels
  CITIES.forEach(c => {
    L.circleMarker(c.coords, {
      radius: 4, color: "#111", weight: 2, fillColor: "#fff", fillOpacity: 1
    }).addTo(map);
    L.tooltip({
      permanent: true,
      direction: "right",
      offset: [7, 0],
      className: "sa-city-label"
    }).setContent(c.name).setLatLng(c.coords).addTo(map);
  });

  // Legend — only shows tiers that actually have counties assigned
  const legend = L.control({ position: "bottomleft" });
  legend.onAdd = function () {
    const div = L.DomUtil.create("div", "sa-legend");
    let html = "<h4>" + MAP_OPTIONS.legendTitle + "</h4>";
    for (const [tierKey, tier] of Object.entries(TIERS)) {
      if (!ASSIGNMENTS[tierKey] || !ASSIGNMENTS[tierKey].length) continue;
      html += '<div class="row"><span class="swatch" style="background:' + tier.color + '"></span><span>' + tier.label + "</span></div>";
    }
    div.innerHTML = html;
    return div;
  };
  legend.addTo(map);
})();
</script>
