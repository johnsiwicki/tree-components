<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hero with Form</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
  }

  .hero {
    position: relative;
    min-height: 560px;
    display: flex;
    align-items: center;
    padding: 64px 24px;
    /* Photo placeholder: swap for background-image: url('your-photo.jpg') */
    background:
      linear-gradient(100deg, rgba(15, 20, 30, 0.85) 0%, rgba(15, 20, 30, 0.55) 45%, rgba(15, 20, 30, 0.25) 100%),
      linear-gradient(160deg, #8a93a3 0%, #b8bfc9 30%, #6e7888 60%, #4a5263 100%);
    background-size: cover;
    background-position: center;
  }

  .hero-inner {
    width: 100%;
    max-width: 1140px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: 1fr 380px;
    gap: 48px;
    align-items: center;
  }

  /* ---- Left copy ---- */
  .hero-copy .eyebrow {
    color: #e8632c;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
  }

  .hero-copy h1 {
    color: #ffffff;
    font-size: clamp(34px, 5vw, 56px);
    font-weight: 800;
    line-height: 1.08;
    text-transform: uppercase;
    margin-bottom: 20px;
  }

  .hero-copy p {
    color: #e6e8ec;
    font-size: 18px;
    line-height: 1.5;
    max-width: 460px;
    margin-bottom: 32px;
  }

  .hero-cta {
    display: inline-block;
    background: #d93a1f;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 16px 28px;
    border-radius: 4px;
    transition: background 0.2s ease;
  }

  .hero-cta:hover { background: #b92e16; }
  .hero-cta::after { content: " \2192"; }

  /* ---- Form card ---- */
  .form-card {
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
  }

  .form-card-header {
    background: #d93a1f;
    color: #ffffff;
    text-align: center;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 16px 20px;
  }

  .form-steps {
    display: flex;
    border-bottom: 1px solid #e5e7eb;
  }

  .form-steps button {
    flex: 1;
    background: #f3f4f6;
    border: none;
    border-right: 1px solid #e5e7eb;
    padding: 12px 8px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #9ca3af;
    cursor: default;
  }

  .form-steps button:last-child { border-right: none; }

  .form-steps button.active {
    background: #ffffff;
    color: #111827;
    border-bottom: 3px solid #d93a1f;
  }

  .form-body { padding: 24px; }

  .form-step { display: none; }
  .form-step.active { display: block; }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #374151;
    margin-bottom: 6px;
  }

  .field input,
  .field textarea {
    width: 100%;
    padding: 12px 14px;
    font-size: 15px;
    font-family: inherit;
    color: #111827;
    border: 1px solid #d1d5db;
    border-radius: 4px;
  }

  .field input:focus,
  .field textarea:focus {
    outline: none;
    border-color: #d93a1f;
    box-shadow: 0 0 0 3px rgba(217, 58, 31, 0.15);
  }

  .form-submit {
    width: 100%;
    background: #d93a1f;
    color: #ffffff;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    border: none;
    border-radius: 4px;
    padding: 15px;
    cursor: pointer;
    transition: background 0.2s ease;
  }

  .form-submit:hover { background: #b92e16; }

  /* ---- Mobile ---- */
  @media (max-width: 860px) {
    .hero { padding: 48px 16px; }

    .hero-inner {
      grid-template-columns: 1fr;
      gap: 36px;
    }

    .hero-copy { text-align: center; }
    .hero-copy p { margin-left: auto; margin-right: auto; }

    .form-card { max-width: 440px; margin: 0 auto; width: 100%; }
  }
</style>
</head>
<body>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-copy">
      <p class="eyebrow">Lorem Ipsum Lorem Ipsum</p>
      <h1>Florida Roofing<br>You Can Rely On</h1>
      <p>Built to withstand those Florida storms. Backed by a company you can trust.</p>
      <a href="#" class="hero-cta">Get Your Free Roof Inspection</a>
    </div>

    <div class="form-card">
      <div class="form-card-header">Contact Us For A Free Estimate</div>
      <div class="form-steps">
        <button type="button" class="step-tab active" data-step="1">Step 1</button>
        <button type="button" class="step-tab" data-step="2">Step 2</button>
        <button type="button" class="step-tab" data-step="3">Step 3</button>
      </div>
      <form class="form-body" id="estimate-form">
        <div class="form-step active" data-step="1">
          <div class="field">
            <label for="first-name">First Name</label>
            <input type="text" id="first-name" name="first-name" placeholder="First Name" required>
          </div>
          <div class="field">
            <label for="last-name">Last Name</label>
            <input type="text" id="last-name" name="last-name" placeholder="Last Name" required>
          </div>
          <button type="button" class="form-submit" data-next="2">Next Step</button>
        </div>

        <div class="form-step" data-step="2">
          <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Email Address" required>
          </div>
          <div class="field">
            <label for="phone">Phone</label>
            <input type="tel" id="phone" name="phone" placeholder="Phone Number" required>
          </div>
          <button type="button" class="form-submit" data-next="3">Next Step</button>
        </div>

        <div class="form-step" data-step="3">
          <div class="field">
            <label for="address">Street Address</label>
            <input type="text" id="address" name="address" placeholder="Street Address" required>
          </div>
          <div class="field">
            <label for="details">How Can We Help?</label>
            <textarea id="details" name="details" rows="3" placeholder="Tell us about your roof..."></textarea>
          </div>
          <button type="submit" class="form-submit">Get My Free Estimate</button>
        </div>
      </form>
    </div>
  </div>
</section>

<script>
  const tabs = document.querySelectorAll('.step-tab');
  const steps = document.querySelectorAll('.form-step');

  function goToStep(n) {
    tabs.forEach(t => t.classList.toggle('active', t.dataset.step === String(n)));
    steps.forEach(s => s.classList.toggle('active', s.dataset.step === String(n)));
  }

  document.querySelectorAll('[data-next]').forEach(btn => {
    btn.addEventListener('click', () => {
      const current = btn.closest('.form-step');
      const inputs = current.querySelectorAll('input, textarea');
      for (const input of inputs) {
        if (!input.reportValidity()) return;
      }
      goToStep(btn.dataset.next);
    });
  });

  tabs.forEach(tab => {
    tab.addEventListener('click', () => goToStep(tab.dataset.step));
  });

  document.getElementById('estimate-form').addEventListener('submit', e => {
    e.preventDefault();
    alert('Thanks! Your free estimate request has been submitted.');
  });
</script>

</body>
</html>
